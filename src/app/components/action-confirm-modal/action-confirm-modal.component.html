<div class="alert-container">
  <div class="alert-card" [@popIn]>
    <div class="icon-circle" [ngStyle]="{'background-color': iconBgColor, 'color': iconColor}">
      <svg *ngIf="type === 'confirm'" xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512" width="36" height="36">
        <path d="M256 80c-8.66 0-16.58 7.36-16 16l8 216a8 8 0 008 8h0a8 8 0 008-8l8-216c.58-8.64-7.34-16-16-16z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/>
        <circle cx="256" cy="416" r="16" fill="currentColor"/>
      </svg>
      <svg *ngIf="type === 'danger'" xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512" width="36" height="36">
        <path d="M256 80c-8.66 0-16.58 7.36-16 16l8 216a8 8 0 008 8h0a8 8 0 008-8l8-216c.58-8.64-7.34-16-16-16z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/>
        <circle cx="256" cy="416" r="16" fill="currentColor"/>
      </svg>
      <svg *ngIf="type === 'warning'" xmlns="http://www.w3.org/2000/svg" class="ionicon" viewBox="0 0 512 512" width="36" height="36">
        <path d="M449.07 399.08L278.64 82.58c-12.08-22.44-44.26-22.44-56.35 0L51.87 399.08A32 32 0 0080 446.25h340.89a32 32 0 0028.18-47.17zm-198.6-1.83a20 20 0 1120-20 20 20 0 01-20 20zm21.72-201.15l-5.74 122a16 16 0 01-32 0l-5.74-121.95a21.73 21.73 0 0121.5-22.69h.21a21.74 21.74 0 0121.73 22.7z" fill="currentColor"/>
      </svg>
    </div>

    <h2 class="alert-title">{{ title }}</h2>
    <p class="alert-message" [innerHTML]="message"></p>

    <div class="alert-actions">
      <button class="btn-cancel" *ngIf="showCancel" (click)="cancel()">
        {{ cancelText }}
      </button>
      <button class="btn-confirm" [ngClass]="type" (click)="confirm()" [style.width]="showCancel ? 'auto' : '100%'">
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
