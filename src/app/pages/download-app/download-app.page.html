<ion-content class="download-content">
  <!-- ปุ่มกลับมุมซ้ายบน -->
  <button class="top-back-btn" (click)="goHome()">
    <ion-icon name="arrow-back-outline"></ion-icon>
    <span>กลับหน้าแรก</span>
  </button>

  <div class="download-container">
    <div class="download-card">
      <div class="header-text">
        <h1 class="title">HuntPuk Mobile</h1>
        <p class="subtitle">ค้นหาและจัดการหอพักง่ายๆ บนมือถือของคุณ</p>
      </div>

      <div class="qr-section">
        <div class="qr-wrapper">
          <img src="assets/mobile__app/mobile_app.jpg" alt="QR Code สำหรับดาวน์โหลดแอป" />
        </div>
        <p class="qr-hint">สแกน QR Code เพื่อดาวน์โหลด</p>
      </div>

      <div class="divider">
        <span>หรือคลิกที่ปุ่มด้านล่างเพื่อดาวน์โหลด</span>
      </div>

      <div class="store-buttons">
        <a href="https://drive.google.com/drive/folders/1qUjpt-Nh-TsIIF2cKscZDNAac2yV66Iz" target="_blank" class="store-btn single-download-btn">
          <ion-icon name="download-outline"></ion-icon>
          <div class="btn-text">
            <span class="big">กดเพื่อดาวน์โหลด</span>
            <span class="small">ไฟล์ .APK สำหรับแอนดรอยด์</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</ion-content>
